name: Backend CD - SSH Test

on:
  push:
    branches:
      - deploy/test

permissions:
  contents: read

jobs:
  ssh-test:
    name: Test VPS SSH Connectivity
    runs-on: ubuntu-latest

    steps:
      - name: Test SSH connection to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "SSH connection successful"
            echo "Connected user: $(whoami)"
            echo "Hostname: $(hostname)"
            echo "Working directory: $(pwd)"